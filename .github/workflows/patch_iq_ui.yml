name: Patch IQ UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'chore: apply IQ UI patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch IQ UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('handlers/iq.py')
          s = p.read_text(encoding='utf-8')

          old = '''    category = QUESTIONS[index][0]\n    diff = QUESTIONS[index][5]\n    diff_text = {1: bi(lang, "Oson", "Лёгкое"), 2: bi(lang, "O‘rta", "Среднее")}.get(diff, bi(lang, "Qiyin", "Сложное"))\n    title = bi(lang, "Premium IQ testi", "Премиум IQ-тест")\n    q = QUESTIONS[index][1].get(lang, QUESTIONS[index][1]["uz"])\n    return f"{IQ_EMOJI} <b>{title}</b>\\n\\n{progress(index)}\\n<b>{index + 1} / {len(QUESTIONS)}</b> · {CATEGORY_NAMES[lang][category]} · {diff_text}\\n\\n<b>{html.escape(q)}</b>"\n'''
          new = '''    title = bi(lang, "Premium IQ testi", "Премиум IQ-тест")\n    q = QUESTIONS[index][1].get(lang, QUESTIONS[index][1]["uz"])\n    return f"{IQ_EMOJI} <b>{title}</b>\\n\\n{progress(index)}\\n<b>{index + 1} / {len(QUESTIONS)}</b>\\n\\n<b>{html.escape(q)}</b>"\n'''
          if old not in s:
              raise SystemExit('question_text block not found')
          s = s.replace(old, new, 1)

          disclaimer = '''    text += [\n        "",\n        bi(lang, "💡 Bu ko‘rsatkich ushbu 30 savollik testdagi natijadan hisoblangan. U rasmiy klinik yoki standartlashtirilgan IQ testi o‘rnini bosmaydi.", "💡 Этот показатель рассчитан по результатам данного теста из 30 заданий. Он не заменяет официальный клинический или стандартизированный IQ-тест."),\n    ]\n'''
          s = s.replace(disclaimer, '', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handlers/iq.py .github/workflows/patch_iq_ui.yml
          git commit -m "chore: apply IQ UI patch"
          git push
